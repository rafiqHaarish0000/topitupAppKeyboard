/*apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'realm-android'
apply plugin: 'kotlin-kapt'*/
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt' // This is crucial for using kapt
    id 'realm-android'
}

// Create a Properties object
def versionProps = new Properties()

// Load properties from a file (optional)
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { stream ->
        versionProps.load(stream)
    }
}
/*Properties versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists())
    versionProps.load(new FileInputStream(versionPropsFile))*/
def code = (versionProps['VERSION_CODE'] ?: "0").toInteger() + 1
versionProps['VERSION_CODE'] = code.toString()
versionProps.store(versionPropsFile.newWriter(), null)

android {
    namespace 'za.co.topitupkeyboard'
    compileSdk 34
    defaultConfig {
        applicationId "za.co.topitupkeyboard"
        minSdkVersion 23
        targetSdk 34
        versionCode 1000
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "TIU_App" + versionName)
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        multiDexEnabled true
        sourceSets {
            main {
                aidl.srcDirs = ['src/main/aidl']
            }
        }
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    buildTypes {
        /* release {
             minifyEnabled false
          //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
         }*/
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    dexOptions {
        javaMaxHeapSize "4g"
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }

    android {
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    dataBinding{
        enabled true
    }


}

ext {
    LAST_VERSION = '1.1.0' // Replace with the latest version
}


